[package]
name = "edge-storage"
description = "SQLite-backed durable storage for PI.Edge. Owns the local database; no client ever opens it directly."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Test-only hook that aborts a unit of work right before COMMIT, to prove
# atomicity of transaction + journal + outbox.
fault-injection = []

[dependencies]
edge-application = { workspace = true }
edge-cash = { workspace = true }
edge-catalog = { workspace = true }
edge-domain = { workspace = true }
edge-payments = { workspace = true }
rusqlite = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
