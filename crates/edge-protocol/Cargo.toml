[package]
name = "edge-protocol"
description = "Versioned wire contract between the PI.Edge core and its local clients. Pure DTOs by default; core mapping behind a feature."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = []
# Conversions for the catalog *content* model: what a producer of snapshots
# needs (the server, and the CLI importer standing in for it). Pure value
# objects — no application layer, no storage.
catalog-mapping = ["dep:edge-domain", "dep:edge-catalog"]
# Everything else: conversions to and from the application layer. Only the
# daemon needs this; a UI client must not have it.
core-mapping = ["catalog-mapping", "dep:edge-application"]

[dependencies]
edge-application = { workspace = true, optional = true }
edge-catalog = { workspace = true, optional = true }
edge-domain = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
