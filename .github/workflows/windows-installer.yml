# Build PX Kiosk as a Windows installer.
#
# A Windows runner, because the installer links MSVC and packages a Windows
# WebView2 runtime. Cross-compiling either from macOS is a worse answer than
# using the machine that does it natively.
#
# The run is arranged to report *everything* wrong in one pass rather than
# stopping at the first problem: every step carries `if: always()`, so a
# failure never prevents the rest from running, and only the final upload is
# conditional on all of them having passed.
#
# Deliberately **not** `continue-on-error`. That also keeps a run going, but
# it rewrites each step's conclusion to `success`, which hides which step
# actually failed from everything that reads the run without log access. With
# `if: always()` the conclusions stay truthful and the job still fails.
name: Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "crates/**"
      - "apps/**"
      - "demo/**"
      - "scripts/build-windows-installer.ps1"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-pc-windows-msvc

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      # Honours rust-toolchain.toml; only the target has to be added.
      - name: Rust
        run: rustup target add x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/tauri-pos/src-tauri -> apps/tauri-pos/src-tauri/target

      # Matching the machine the lockfile was written on. `--frozen-lockfile`
      # is only a guarantee if the resolver is the same one.
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/tauri-pos/pnpm-lock.yaml

      # ---------------------------------------------------------------- gates
      # Each records its own outcome and lets the run continue, so one pass
      # reports every failure instead of only the first.

      - name: Gate — fmt
        id: fmt
        if: always()
        run: cargo fmt --all --check

      - name: Gate — clippy
        id: clippy
        if: always()
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # `--no-fail-fast` runs every test binary rather than stopping at the
      # first target that fails, which is what turned the last four runs into
      # one failure each.
      - name: Gate — tests
        id: tests
        if: always()
        run: cargo test --workspace --no-fail-fast

      - name: Frontend dependencies
        id: deps
        if: always()
        working-directory: apps/tauri-pos
        run: pnpm install --frozen-lockfile

      - name: Gate — lint
        id: lint
        if: always()
        working-directory: apps/tauri-pos
        run: pnpm lint

      - name: Gate — typecheck
        id: typecheck
        if: always()
        working-directory: apps/tauri-pos
        run: pnpm typecheck

      - name: Gate — frontend build
        id: fe_build
        if: always()
        working-directory: apps/tauri-pos
        run: pnpm build

      # The kiosk's own unit tests: the pick-to-screen rule, the selection
      # model, the closed sign, the camera. `cargo test --workspace` cannot
      # reach them — this package is deliberately outside the workspace — so
      # nothing ran them until they were added here.
      - name: Gate — kiosk tests
        id: kiosk_tests
        if: always()
        working-directory: apps/tauri-pos
        run: pnpm test

      # ---------------------------------------------------- runtime sidecars
      # Before the Tauri crate is even *checked*: `tauri-build` validates the
      # `externalBin` entries from its build script, so `cargo clippy` on that
      # crate fails with "resource path doesn't exist" until these are staged.
      # Build and stage first, and the gate tests what actually ships.

      - name: Build PI.Edge for Windows
        id: core_build
        if: always()
        run: cargo build --release --target $env:TARGET -p edge-daemon -p edge-cli

      - name: Stage the sidecars
        id: staging
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'apps/tauri-pos/src-tauri/binaries'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          foreach ($name in 'edge-daemon', 'edge-cli') {
            $from = "target/$env:TARGET/release/$name.exe"
            if (-not (Test-Path $from)) { throw "missing $from" }
            # Tauri resolves externalBin by appending the target triple.
            Copy-Item $from "$dir/$name-$env:TARGET.exe" -Force
            $mb = [math]::Round((Get-Item "$dir/$name-$env:TARGET.exe").Length / 1MB, 1)
            Write-Host "  $name-$env:TARGET.exe  $mb MB"
          }

      - name: Gate — tauri crate
        id: tauri_crate
        if: always()
        working-directory: apps/tauri-pos/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          # Same reason as the kiosk tests above: this crate is outside the
          # Cargo workspace, so `cargo test --workspace` never sees it. Its
          # tests cover the bootstrap guard that decides whether a lane gets
          # its menu and the note acceptor's transport, which are exactly the
          # two things a Windows build has got wrong before.
          cargo test

      # ------------------------------------------------------------ packaging

      # Attempted even when a gate failed, so one run also tells us whether
      # the installer itself is sound. The upload at the end is what stays
      # conditional.

      - name: Tauri build (NSIS)
        id: tauri_build
        if: always()
        working-directory: apps/tauri-pos
        run: pnpm tauri build --target x86_64-pc-windows-msvc

      # ---------------------------------------------------------- diagnostics

      # The Tauri crate is deliberately outside the Cargo workspace, so its
      # build output is under its own target directory — not the workspace's,
      # which is where this used to look and find nothing.
      - name: Check the bundled demo
        id: demo
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tree = "apps/tauri-pos/src-tauri/target/$env:TARGET/release"
          if (-not (Test-Path $tree)) { throw "no Tauri build output at $tree" }

          # Find what Tauri actually staged rather than assuming a layout.
          $staged = Get-ChildItem $tree -Recurse -Filter 'menu.json' -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '[\\/]demo[\\/]' } |
            Select-Object -First 1
          if (-not $staged) {
            Write-Host "::error::no demo/menu.json anywhere under $tree"
            Get-ChildItem $tree -Recurse -Directory -Filter 'demo' |
              ForEach-Object { Write-Host "  candidate: $($_.FullName)" }
            throw 'the demo was not staged into the bundle'
          }
          Write-Host "staged menu.json: $($staged.FullName)"

          $assets = Join-Path $staged.Directory.FullName 'assets'
          if (-not (Test-Path $assets)) { throw "no assets beside $($staged.FullName)" }

          $jpegs = @(Get-ChildItem $assets -Filter *.jpg)
          Write-Host "photographs: $($jpegs.Count)"
          if ($jpegs.Count -lt 13) { throw "expected at least 13 photographs, found $($jpegs.Count)" }

          foreach ($name in 'cerveza.gif', 'mozzarella.gif') {
            $gif = Join-Path $assets $name
            if (-not (Test-Path $gif)) { throw "$name did not ship" }
            $bytes = [System.IO.File]::ReadAllBytes($gif)
            $magic = -join ($bytes[0..5] | ForEach-Object { [char]$_ })
            if ($magic -notin @('GIF89a', 'GIF87a')) { throw "$name is not a GIF: $magic" }
            # More than one Graphic Control Extension means it still moves,
            # so no build step re-encoded or flattened it.
            $frames = 0
            for ($i = 0; $i -lt $bytes.Length - 3; $i++) {
              if ($bytes[$i] -eq 0x00 -and $bytes[$i+1] -eq 0x21 -and
                  $bytes[$i+2] -eq 0xF9 -and $bytes[$i+3] -eq 0x04) { $frames++ }
            }
            if ($frames -le 1) { throw "$name was flattened to a still" }
            Write-Host "  ${name}: $magic, $frames frames, $($bytes.Length) bytes"
          }

          # ---------------------------------------------------- the retail lane
          #
          # The second vertical is a separate dataset and a separate folder of
          # photographs, declared separately in the bundle's resources. An
          # installer that shipped only the restaurant would look perfectly
          # healthy until somebody switched lanes on a stand, so it is checked
          # here rather than discovered there (ADR 047).

          $retail = Join-Path $staged.Directory.FullName 'retail'
          if (-not (Test-Path $retail)) {
            throw "the retail lane did not ship: no $retail"
          }
          $retailMenu = Join-Path $retail 'menu.json'
          if (-not (Test-Path $retailMenu)) { throw "no menu.json in $retail" }
          $shelf = Get-Content $retailMenu -Raw | ConvertFrom-Json
          Write-Host "retail products: $($shelf.products.Count), categories: $($shelf.categories.Count)"
          if ($shelf.products.Count -ne 22) {
            throw "expected 22 retail products, found $($shelf.products.Count)"
          }

          $retailAssets = Join-Path $retail 'assets'
          if (-not (Test-Path $retailAssets)) { throw "no assets in $retail" }
          $photos = @(Get-ChildItem $retailAssets -Filter *.jpg)
          $drawn  = @(Get-ChildItem $retailAssets -Filter *.png)
          Write-Host "retail photographs: $($photos.Count), placeholders: $($drawn.Count)"
          if ($photos.Count -ne 18) {
            throw "expected 18 real retail photographs, found $($photos.Count)"
          }
          # One image per product, and every one of them present.
          if (($photos.Count + $drawn.Count) -ne $shelf.products.Count) {
            throw "$($shelf.products.Count) products but $($photos.Count + $drawn.Count) images"
          }
          foreach ($photo in $photos) {
            if ($photo.Length -lt 4000) { throw "$($photo.Name) is $($photo.Length) bytes" }
          }

          # ------------------------------------------------- the brand lanes
          #
          # Tim Hortons and Sbarro are two more channels of the same snapshot,
          # declared as their own resources. An installer that shipped without
          # them would look healthy until somebody switched brand on a stand.
          foreach ($lane in @(
            @{ slug = 'tim';    products = 13; photos = 13 },
            @{ slug = 'sbarro'; products = 14; photos = 14 }
          )) {
            $folder = Join-Path $staged.Directory.FullName $lane.slug
            if (-not (Test-Path $folder)) { throw "the $($lane.slug) lane did not ship" }
            $menu = Join-Path $folder 'menu.json'
            if (-not (Test-Path $menu)) { throw "no menu.json in $folder" }
            $shelf = Get-Content $menu -Raw | ConvertFrom-Json
            # Component products price a modifier and never appear on a menu,
            # so the shelf is counted by what has presentation.
            $onMenu = @($shelf.presentation).Count
            $pictures = @(Get-ChildItem (Join-Path $folder 'assets') -Filter *.jpg)
            Write-Host "$($lane.slug): $onMenu products, $($pictures.Count) photographs"
            if ($onMenu -ne $lane.products) {
              throw "expected $($lane.products) $($lane.slug) products, found $onMenu"
            }
            if ($pictures.Count -ne $lane.photos) {
              throw "expected $($lane.photos) $($lane.slug) photographs, found $($pictures.Count)"
            }
            foreach ($picture in $pictures) {
              if ($picture.Length -lt 4000) {
                throw "$($picture.Name) is $($picture.Length) bytes"
              }
            }
          }

          # ------------------------------------------- nothing points outside
          #
          # Source material, build machines and the network are all things this
          # installer must not need. A dataset that mentions any of them works
          # where it was built and nowhere else.
          $datasets = @($staged.FullName, $retailMenu) + @(
            'tim', 'sbarro' | ForEach-Object {
              Join-Path (Join-Path $staged.Directory.FullName $_) 'menu.json'
            }
          )
          foreach ($dataset in $datasets) {
            $text = Get-Content $dataset -Raw
            foreach ($forbidden in 'examples/', 'http://', 'https://', 'file://', '/Users/', 'C:\Users') {
              if ($text.Contains($forbidden)) {
                throw "$dataset mentions '$forbidden'"
              }
            }
          }
          Write-Host "datasets reference nothing outside the installation"


      - name: Check the installer
        id: nsis
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Same reason as above: Tauri bundles into its own target tree.
          $dir = "apps/tauri-pos/src-tauri/target/$env:TARGET/release/bundle/nsis"
          if (-not (Test-Path $dir)) { throw "no NSIS output directory at $dir" }
          $found = Get-ChildItem $dir -Filter '*-setup.exe' -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $found) {
            Get-ChildItem $dir | ForEach-Object { Write-Host "  present: $($_.Name)" }
            throw "no *-setup.exe in $dir"
          }
          Write-Host "built: $($found.Name)"

          # One predictable name, beside the installer Tauri produced. No
          # copying between target trees.
          $final = Join-Path $dir 'PX-Kiosk-Setup-x64.exe'
          Copy-Item $found.FullName $final -Force
          $mb = [math]::Round((Get-Item $final).Length / 1MB, 1)
          Write-Host "installer: $final  $mb MB"
          "installer=$final" | Out-File $env:GITHUB_OUTPUT -Append
          "size_mb=$mb"      | Out-File $env:GITHUB_OUTPUT -Append

          # The offline WebView2 bootstrapper is well over a hundred MB; an
          # installer far below that means the setting did not take effect.
          if ($mb -lt 100) {
            throw "installer is only ${mb} MB — webviewInstallMode=offlineInstaller did not take"
          }

      # -------------------------------------------- what is actually inside
      #
      # Every step above proves the pieces compiled. None of them proves the
      # pieces are in the file somebody will double-click — and that is a real
      # gap, not a theoretical one: a resource declared and not staged, or a
      # sidecar built and not bundled, looks exactly like a healthy build
      # until a stand.
      #
      # So the installer is unpacked and inspected. 7-Zip is already on the
      # runner image, so this adds no software to the project and nothing to
      # the runtime.
      #
      # Two kinds of check, and they are **not** equally strong:
      #
      #   * **files** — the main binary, both sidecars, the WebView2 offline
      #     bootstrapper, the four datasets and their photographs. Reliable,
      #     and fatal: a missing one means the installer is wrong.
      #   * **strings** — evidence in `.rdata` that a feature is compiled in.
      #     Reliable for a `&'static str` the code keeps; **not** a proof of
      #     absence. A literal the compiler folded away, or one that only
      #     exists inside the brotli-compressed frontend Tauri embeds in its
      #     own binary, will not be found however present the feature is. So
      #     these are *reported*, and the step fails only when a whole binary
      #     yields nothing — which means the scan broke, not the feature.
      - name: Inspect the installer payload
        id: payload
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nsis = "apps/tauri-pos/src-tauri/target/$env:TARGET/release/bundle/nsis"
          $installer = Join-Path $nsis 'PX-Kiosk-Setup-x64.exe'
          if (-not (Test-Path $installer)) { throw "no installer to inspect at $installer" }

          $seven = (Get-Command 7z -ErrorAction SilentlyContinue).Source
          if (-not $seven) { $seven = 'C:\Program Files\7-Zip\7z.exe' }
          if (-not (Test-Path $seven)) {
            throw "no 7-Zip on this runner; the payload cannot be unpacked"
          }
          Write-Host "7-Zip: $seven"

          $out = Join-Path $env:RUNNER_TEMP 'payload'
          Remove-Item -Recurse -Force $out -ErrorAction SilentlyContinue
          & $seven x $installer "-o$out" -y -bso0 -bsp0
          if ($LASTEXITCODE -ne 0) {
            throw "7-Zip could not unpack the NSIS payload (exit $LASTEXITCODE)"
          }
          # An installer that packs its payload into a nested archive is
          # unpacked one level further, so the checks below see real files
          # either way.
          foreach ($nested in Get-ChildItem $out -Recurse -File -Include *.7z,*.zip,*.cab) {
            & $seven x $nested.FullName "-o$($nested.DirectoryName)" -y -bso0 -bsp0 | Out-Null
          }

          $files = @(Get-ChildItem $out -Recurse -File)
          $mb = [math]::Round((($files | Measure-Object Length -Sum).Sum) / 1MB, 1)
          Write-Host "NSIS EXTRACTION: $($files.Count) files, $mb MB"
          Write-Host '--- payload, by size ---'
          $files | Sort-Object Length -Descending | Select-Object -First 25 |
            ForEach-Object {
              Write-Host ("  {0,10:N2} MB  {1}" -f ($_.Length / 1MB), $_.FullName.Substring($out.Length + 1))
            }

          $missing = New-Object System.Collections.Generic.List[string]

          function Need([string] $label, [string[]] $names) {
            $hit = $files | Where-Object { $names -contains $_.Name } | Select-Object -First 1
            if (-not $hit) {
              $hit = $files | Where-Object { $n = $_.Name; $names | Where-Object { $n -like $_ } } |
                Select-Object -First 1
            }
            if (-not $hit) {
              $script:missing.Add("$label (looked for $($names -join ', '))")
              Write-Host ("::error::{0} is not in the payload (looked for {1})" -f $label, ($names -join ', '))
              return $null
            }
            Write-Host ("{0,-24} {1,-46} {2,8:N2} MB" -f $label, $hit.Name, ($hit.Length / 1MB))
            return $hit
          }

          Write-Host '--- the programs ---'
          # Tauri names the main binary after `productName`; the crate name is
          # accepted too so a rename of either does not read as absent.
          $main   = Need 'TAURI POS'      @('PX Kiosk.exe', 'tauri-pos.exe')
          $daemon = Need 'edge-daemon'    @('edge-daemon.exe')
          $cli    = Need 'edge-cli'       @('edge-cli.exe')
          $webview = Need 'WEBVIEW2'      @('*WebView2*.exe', '*Webview2*.exe', '*webview2*.exe')

          Write-Host '--- the datasets ---'
          # Each experience, by the folder its `menu.json` sits in, and the
          # photographs beside it. The counts are the acceptance numbers.
          $lanes = @(
            @{ label = 'RESTAURANT DATASET'; dir = 'demo';        photos = 13; kind = '*.jpg' }
            @{ label = 'TIM DATASET';        dir = 'demo/tim';    photos = 13; kind = '*.jpg' }
            @{ label = 'SBARRO DATASET';     dir = 'demo/sbarro'; photos = 14; kind = '*.jpg' }
            @{ label = 'RETAIL DATASET';     dir = 'demo/retail'; photos = 18; kind = '*.jpg' }
          )
          foreach ($lane in $lanes) {
            $leaf = ($lane.dir -split '/')[-1]
            $menu = $files | Where-Object {
              $_.Name -eq 'menu.json' -and $_.Directory.Name -eq $leaf
            } | Select-Object -First 1
            if (-not $menu) {
              $missing.Add("$($lane.label): no menu.json in a `"$leaf`" folder")
              Write-Host ("::error::{0}: no menu.json in a '{1}' folder" -f $lane.label, $leaf)
              continue
            }
            $assets = Join-Path $menu.Directory.FullName 'assets'
            if (-not (Test-Path $assets)) {
              $missing.Add("$($lane.label): no assets beside $($menu.FullName)")
              Write-Host ("::error::{0}: no assets folder beside its menu.json" -f $lane.label)
              continue
            }
            $pictures = @(Get-ChildItem $assets -Filter $lane.kind)
            $shelf = Get-Content $menu.FullName -Raw | ConvertFrom-Json
            # A brand's shelf is what has presentation; the base and retail
            # datasets are counted by their product list.
            $onMenu = if ($shelf.PSObject.Properties.Name -contains 'presentation' -and
                          @($shelf.presentation).Count -gt 0) {
              @($shelf.presentation).Count
            } else {
              @($shelf.products).Count
            }
            Write-Host ("{0,-24} {1,3} on the shelf, {2,3} photographs" -f $lane.label, $onMenu, $pictures.Count)
            if ($pictures.Count -ne $lane.photos) {
              $missing.Add("$($lane.label): $($pictures.Count) photographs, expected $($lane.photos)")
              Write-Host ("::error::{0}: {1} photographs, expected {2}" -f $lane.label, $pictures.Count, $lane.photos)
            }
          }
          # And the four menus are four, not one found four times.
          $menus = @($files | Where-Object { $_.Name -eq 'menu.json' })
          Write-Host "menu.json in the payload: $($menus.Count)"
          if ($menus.Count -lt 4) {
            $missing.Add("only $($menus.Count) menu.json in the payload; the four experiences need four")
            Write-Host "::error::only $($menus.Count) menu.json in the payload"
          }

          # ------------------------------------------------- compiled evidence
          #
          # Read as Latin-1 so no byte collapses into a '?' and a needle can
          # never match by accident.
          function Scan([System.IO.FileInfo] $file) {
            if (-not $file) { return '' }
            return [Text.Encoding]::Latin1.GetString([IO.File]::ReadAllBytes($file.FullName))
          }

          function Report([string] $label, [string[]] $needles, [string] $haystack, [string] $where) {
            if (-not $haystack) {
              Write-Host ("  {0,-26} SKIPPED ({1} is not in the payload)" -f $label, $where)
              return $false
            }
            foreach ($needle in $needles) {
              if ($haystack.Contains($needle)) {
                Write-Host ("  {0,-26} FOUND in {1}  (`"{2}`")" -f $label, $where, $needle)
                return $true
              }
            }
            Write-Host ("  {0,-26} not found in {1}" -f $label, $where)
            return $false
          }

          Write-Host '--- compiled into the host binary ---'
          $host_text = Scan $main
          $hostFound = 0
          foreach ($check in @(
            @{ l = 'DEMO STATUS';       n = @('/demo/status') }
            @{ l = 'DEMO PRODUCTS';     n = @('/demo/products') }
            @{ l = 'REMOTE AUTH';       n = @('/demo/control/authorization') }
            @{ l = 'REMOTE OPEN/CLOSE'; n = @('/demo/control/kiosk') }
            @{ l = 'authorization_required'; n = @('authorization_required') }
            @{ l = 'remote_control';    n = @('remote_control') }
            @{ l = 'CASHGENIC';         n = @('CASHGENIC_UNREACHABLE', 'cashgenic', 'CashGenic') }
          )) {
            if (Report $check.l $check.n $host_text 'the host binary') { $hostFound++ }
          }

          Write-Host '--- compiled into edge-daemon ---'
          $daemon_text = Scan $daemon
          $daemonFound = 0
          foreach ($check in @(
            @{ l = 'DLE EOT';           n = @('DLE EOT', 'did not answer DLE EOT') }
            @{ l = 'USBPRINT';          n = @('readable USB printer', 'the USB printer') }
            @{ l = 'status sources';    n = @('DLE_EOT') }
            @{ l = 'preset RPT004';     n = @('RPT004') }
            @{ l = 'preset RPT008';     n = @('RPT008') }
            @{ l = 'preset RPT015';     n = @('RPT015') }
            @{ l = 'preset EPSON-EU30'; n = @('EPSON-EU30') }
            @{ l = 'preset TM-T82III';  n = @('EPSON-TM-T82III') }
            @{ l = 'preset TM-T88VI';   n = @('EPSON-TM-T88VI') }
          )) {
            if (Report $check.l $check.n $daemon_text 'edge-daemon') { $daemonFound++ }
          }

          Write-Host ''
          Write-Host "string evidence: host $hostFound/7, edge-daemon $daemonFound/9"
          # A binary that yields nothing means the scan is broken — a wrong
          # path, a compressed section, an encoding mistake — not that every
          # feature vanished. That is worth failing on; one absent literal is
          # not, and is reported above instead.
          if ($main -and $hostFound -eq 0) {
            $missing.Add('no expected string was found anywhere in the host binary; the scan is unreliable')
            Write-Host '::error::no expected string found in the host binary'
          }
          if ($daemon -and $daemonFound -eq 0) {
            $missing.Add('no expected string was found anywhere in edge-daemon; the scan is unreliable')
            Write-Host '::error::no expected string found in edge-daemon'
          }

          if ($missing.Count -gt 0) {
            throw "the installer payload is missing $($missing.Count) thing(s): $($missing -join '; ')"
          }
          Write-Host 'the installer carries every file this build promised'

      # ------------------------------------------------------------- verdict
      # One place that says what passed and what did not, so the log does not
      # have to be read step by step.

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          $rows = @(
            @{ n = 'fmt';              r = '${{ steps.fmt.outcome }}' }
            @{ n = 'clippy';           r = '${{ steps.clippy.outcome }}' }
            @{ n = 'tests';            r = '${{ steps.tests.outcome }}' }
            @{ n = 'frontend install'; r = '${{ steps.deps.outcome }}' }
            @{ n = 'lint';             r = '${{ steps.lint.outcome }}' }
            @{ n = 'typecheck';        r = '${{ steps.typecheck.outcome }}' }
            @{ n = 'frontend build';   r = '${{ steps.fe_build.outcome }}' }
            @{ n = 'kiosk tests';      r = '${{ steps.kiosk_tests.outcome }}' }
            @{ n = 'tauri crate';      r = '${{ steps.tauri_crate.outcome }}' }
            @{ n = 'edge-daemon/cli';  r = '${{ steps.core_build.outcome }}' }
            @{ n = 'sidecar staging';  r = '${{ steps.staging.outcome }}' }
            @{ n = 'tauri build';      r = '${{ steps.tauri_build.outcome }}' }
            @{ n = 'bundled demo';     r = '${{ steps.demo.outcome }}' }
            @{ n = 'nsis installer';   r = '${{ steps.nsis.outcome }}' }
            @{ n = 'installer payload'; r = '${{ steps.payload.outcome }}' }
          )
          "## Windows build" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "| step | result |`n| --- | --- |" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          foreach ($row in $rows) {
            $mark = if ($row.r -eq 'success') { 'PASS' } else { 'FAIL' }
            "| $($row.n) | $mark |" | Out-File $env:GITHUB_STEP_SUMMARY -Append
            Write-Host ("{0,-18} {1}" -f $row.n, $mark)
          }
          $failed = @($rows | Where-Object { $_.r -ne 'success' })
          if ($failed.Count -gt 0) {
            # Reported, not thrown: the steps themselves now carry their own
            # verdict, so the job already fails and each failure is visible
            # without reading this log.
            Write-Host "::warning::$($failed.Count) step(s) failed: $(($failed | ForEach-Object { $_.n }) -join ', ')"
          }

      # Only ever uploaded from a run where every step above succeeded.
      - name: Upload the installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PX-Kiosk-Setup-x64
          path: apps/tauri-pos/src-tauri/target/${{ env.TARGET }}/release/bundle/nsis/PX-Kiosk-Setup-x64.exe
          if-no-files-found: error
          retention-days: 30
